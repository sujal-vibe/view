<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Dashboard</title>
<style>
  :root{--bg:#0e1b2c;--bar:#13263d;--ink:#e8f1fa;--muted:#8fa6bd;--accent:#2fb4e6;--line:#25405c}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
  #bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line);transition:margin-top .25s;overflow-x:auto;white-space:nowrap}
  body.hidebar #bar{margin-top:-46px}
  #tabs{display:flex;gap:6px;margin-right:auto}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;flex:none}
  button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;flex:none}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);color:#04202e;border-color:var(--accent)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #stage{height:calc(100% - 46px);display:grid;gap:6px;padding:6px;transition:height .25s}
  body.hidebar #stage{height:100%}
  .pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:6px;overflow:hidden;position:relative}
  .pane iframe{flex:1;width:100%;border:0;background:#fff}
  .pane .label{position:absolute;top:6px;left:6px;z-index:2;background:rgba(14,27,44,.75);color:var(--ink);font-size:12px;padding:3px 8px;border-radius:4px;pointer-events:none}
  body.hidebar .label{display:none}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#47607a;padding:24px;font-size:15px;line-height:1.5}
  #stage.single{grid-template-columns:1fr;grid-template-rows:1fr}
  #stage.single .pane{display:none}
  #stage.single .pane.active{display:flex}
  /* settings */
  dialog{background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(720px,94vw);max-height:90vh;overflow:auto}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{margin:0 0 4px;font-size:17px}
  .sub{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.4}
  .vrow{display:grid;grid-template-columns:28px 1fr 2fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .vrow .num{color:var(--muted);font-size:13px;text-align:center}
  .vrow .mv{display:flex;gap:4px}
  .vrow button{padding:5px 8px}
  input[type=text],input[type=number]{width:100%;padding:8px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .actions{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
  .actions .r{display:flex;gap:8px}
</style>
</head>
<body>

<div id="bar">
  <div id="tabs"></div>
  <span class="sep"></span>
  <button id="btnRotate" title="Auto-rotate between views (R)">Auto-rotate: off</button>
  <button id="btnRefresh" title="Reload all views">Reload</button>
  <button id="btnSettings">Settings</button>
  <button id="btnFull" title="Full screen (F)">Full screen</button>
</div>

<div id="stage" class="single"></div>

<dialog id="dlg">
  <h2>Views</h2>
  <p class="sub">Add as many views as you need. Each one is a link to a Power BI report or any web page that allows embedding.</p>
  <div id="rows"></div>
  <button id="btnAdd">+ Add view</button>
  <div class="row">
    <div><label for="rot">Rotate every (seconds)</label><input type="number" id="rot" min="5"></div>
    <div><label for="ref">Reload every (minutes, 0 = never)</label><input type="number" id="ref" min="0"></div>
  </div>
  <div class="actions">
    <span></span>
    <div class="r"><button id="btnCancel">Cancel</button><button id="btnSave" class="on">Save</button></div>
  </div>
</dialog>

<script>
/* Optional: pre-fill views here so the page opens ready to use. */
const DEFAULTS = {
  views: [
    { name: "Power BI – KRA Report", url: "" },
    { name: "In-house Report", url: "" }
  ],
  rot: 30,
  ref: 10
};

const KEY = "teamDashboardCfg2";
const $ = id => document.getElementById(id);
let cfg = load();
let mode = "single";   // "single" or "grid"
let active = 0;
let rotTimer = null, refTimer = null, draft = [];

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(s && Array.isArray(s.views) && s.views.length) return Object.assign({}, DEFAULTS, s);
    // migrate from the older two-report version
    const old = JSON.parse(localStorage.getItem("teamDashboardCfg") || "null");
    if(old && (old.u1 || old.u2)){
      return { views:[{name:old.n1||"Report 1",url:old.u1||""},{name:old.n2||"Report 2",url:old.u2||""}], rot:old.rot||30, ref:old.ref??10 };
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} }

function build(){
  const st = $("stage");
  st.textContent = "";
  cfg.views.forEach((v,i)=>{
    const pane = document.createElement("section");
    pane.className = "pane";
    const lb = document.createElement("span");
    lb.className = "label"; lb.textContent = v.name || ("View "+(i+1));
    pane.appendChild(lb);
    if(v.url){
      const f = document.createElement("iframe");
      f.src = v.url; f.allowFullscreen = true;
      f.setAttribute("allow","fullscreen; autoplay");
      pane.appendChild(f);
    }else{
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "No link yet. Open Settings and paste the URL for " + (v.name || "this view") + ".";
      pane.appendChild(d);
    }
    st.appendChild(pane);
  });
  if(active >= cfg.views.length) active = 0;
  renderTabs(); apply();
}

function renderTabs(){
  const t = $("tabs"); t.textContent = "";
  cfg.views.forEach((v,i)=>{
    const b = document.createElement("button");
    b.textContent = (i+1) + ". " + (v.name || "View "+(i+1));
    b.title = "Show only this view (key " + (i+1) + ")";
    b.className = (mode==="single" && active===i) ? "on" : "";
    b.onclick = ()=>{ stopRotate(); selectView(i); };
    t.appendChild(b);
  });
  if(cfg.views.length > 1){
    const g = document.createElement("button");
    g.textContent = "All";
    g.title = "Show all views together (key G)";
    g.className = mode==="grid" ? "on" : "";
    g.onclick = ()=>{ stopRotate(); showGrid(); };
    t.appendChild(g);
  }
}

function apply(){
  const st = $("stage"), n = cfg.views.length;
  st.className = mode;
  if(mode==="grid"){
    const cols = n<=3 ? n : (n===4 ? 2 : 3);
    st.style.gridTemplateColumns = "repeat("+cols+",1fr)";
    st.style.gridAutoRows = "1fr";
  }else{
    st.style.gridTemplateColumns = ""; st.style.gridAutoRows = "";
  }
  [...st.children].forEach((p,i)=> p.classList.toggle("active", i===active));
  renderTabs();
}
function selectView(i){ active = i; mode = "single"; apply(); }
function showGrid(){ mode = "grid"; apply(); }
function step(d){
  const n = cfg.views.length;
  active = (active + d + n) % n; mode = "single"; apply();
}

function startRotate(){
  if(cfg.views.length < 2) return;
  clearInterval(rotTimer);
  mode = "single"; apply();
  $("btnRotate").classList.add("on");
  $("btnRotate").textContent = "Auto-rotate: on";
  rotTimer = setInterval(()=> step(1), Math.max(5, cfg.rot)*1000);
}
function stopRotate(){
  clearInterval(rotTimer); rotTimer = null;
  $("btnRotate").classList.remove("on");
  $("btnRotate").textContent = "Auto-rotate: off";
}
$("btnRotate").onclick = ()=> rotTimer ? stopRotate() : startRotate();

function setRefresh(){
  clearInterval(refTimer);
  if(cfg.ref > 0) refTimer = setInterval(build, cfg.ref*60000);
}
$("btnRefresh").onclick = build;

/* full screen */
function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
$("btnFull").onclick = toggleFull;
document.addEventListener("fullscreenchange", ()=>{
  const fs = !!document.fullscreenElement;
  document.body.classList.toggle("hidebar", fs);
  $("btnFull").textContent = fs ? "Exit full screen" : "Full screen";
});
document.addEventListener("mousemove", e=>{
  if(document.fullscreenElement) document.body.classList.toggle("hidebar", e.clientY > 50);
});

/* settings */
function renderRows(){
  const box = $("rows"); box.textContent = "";
  draft.forEach((v,i)=>{
    const r = document.createElement("div"); r.className = "vrow";
    const num = document.createElement("span"); num.className = "num"; num.textContent = i+1;
    const nm = document.createElement("input"); nm.type = "text"; nm.placeholder = "Name"; nm.value = v.name;
    nm.setAttribute("aria-label","Name of view "+(i+1));
    nm.oninput = ()=> v.name = nm.value;
    const ur = document.createElement("input"); ur.type = "text"; ur.placeholder = "https://..."; ur.value = v.url;
    ur.setAttribute("aria-label","URL of view "+(i+1));
    ur.oninput = ()=> v.url = ur.value;
    const mv = document.createElement("div"); mv.className = "mv";
    const mk = (txt,title,fn,dis)=>{ const b=document.createElement("button"); b.textContent=txt; b.title=title; b.disabled=!!dis; b.onclick=fn; return b; };
    mv.appendChild(mk("↑","Move up",()=>{ [draft[i-1],draft[i]]=[draft[i],draft[i-1]]; renderRows(); }, i===0));
    mv.appendChild(mk("↓","Move down",()=>{ [draft[i+1],draft[i]]=[draft[i],draft[i+1]]; renderRows(); }, i===draft.length-1));
    mv.appendChild(mk("✕","Remove",()=>{ draft.splice(i,1); renderRows(); }, draft.length<=1));
    r.append(num, nm, ur, mv);
    box.appendChild(r);
  });
}
$("btnSettings").onclick = ()=>{
  draft = cfg.views.map(v=>({name:v.name,url:v.url}));
  $("rot").value = cfg.rot; $("ref").value = cfg.ref;
  renderRows(); $("dlg").showModal();
};
$("btnAdd").onclick = ()=>{
  draft.push({name:"View "+(draft.length+1), url:""}); renderRows();
  const ins = $("rows").querySelectorAll("input"); if(ins.length) ins[ins.length-2].focus();
};
$("btnCancel").onclick = ()=> $("dlg").close();
$("btnSave").onclick = ()=>{
  cfg.views = draft.map(v=>({name:v.name.trim(), url:v.url.trim()}));
  cfg.rot = +$("rot").value || 30;
  cfg.ref = Math.max(0, +$("ref").value || 0);
  save();
  const wasRotating = !!rotTimer;
  stopRotate(); active = 0; build(); setRefresh();
  if(wasRotating) startRotate();
  $("dlg").close();
};

/* keyboard */
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT" || $("dlg").open) return;
  const k = e.key;
  if(k==="f"||k==="F") toggleFull();
  else if(k==="r"||k==="R") $("btnRotate").click();
  else if(k==="g"||k==="G"){ stopRotate(); showGrid(); }
  else if(k==="ArrowRight"){ stopRotate(); step(1); }
  else if(k==="ArrowLeft"){ stopRotate(); step(-1); }
  else if(/^[1-9]$/.test(k) && +k <= cfg.views.length){ stopRotate(); selectView(+k-1); }
});

build(); setRefresh();
if(cfg.views.every(v=>!v.url)) $("btnSettings").click();
</script>
</body>
</html>
